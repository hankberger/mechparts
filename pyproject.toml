[project]
name = "mechparts"
version = "0.1.0"
description = "Agent-native parametric mechanical parts library: search, configure and download 3D-printable parts."
readme = "README.md"
license = "MIT"
requires-python = ">=3.11,<3.14"
dependencies = [
    "build123d>=0.9",
    "bd_warehouse>=0.4",
    "trimesh>=4.0",
    "numpy>=1.26",
    "pydantic>=2.6",
    "fastapi>=0.110",
    "uvicorn[standard]>=0.29",
    "mcp>=2.0,<3",
]

[project.optional-dependencies]
preview = ["matplotlib>=3.8"]

[dependency-groups]
dev = ["pytest>=8", "httpx>=0.27", "shapely>=2.0", "matplotlib>=3.8"]

[project.scripts]
mechparts = "mechparts.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/mechparts"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["tests"]
